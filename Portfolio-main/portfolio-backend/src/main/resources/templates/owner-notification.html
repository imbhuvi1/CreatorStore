<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>New Portfolio Message</title></head>
<body style="font-family: Arial, sans-serif; color:#1a1a1a; background:#f5f5f7; padding:24px;">
<div style="max-width:640px;margin:auto;background:#ffffff;border-radius:12px;padding:24px;">
    <h2 style="margin:0 0 12px;color:#2a2f80;">New message from your portfolio</h2>
    <p><strong>Name:</strong> <span th:text="${name}">-</span></p>
    <p><strong>Email:</strong> <span th:text="${email}">-</span></p>
    <p><strong>Phone:</strong> <span th:text="${phone}">-</span></p>
    <p><strong>Subject:</strong> <span th:text="${subject}">-</span></p>
    <hr>
    <p style="white-space:pre-wrap" th:text="${message}">-</p>
</div>
</body>
</html>
