<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Thank you for contacting me</title></head>
<body style="font-family: Arial, sans-serif; color:#1a1a1a; background:#f5f5f7; padding:24px;">
<div style="max-width:640px;margin:auto;background:#ffffff;border-radius:12px;padding:24px;">
    <h2 style="margin:0 0 12px;color:#2a2f80;">Thank you for reaching out</h2>
    <p>Hello <strong th:text="${visitorName}">Visitor</strong>,</p>
    <p>Thank you for reaching out through my portfolio website. I have received your message and will connect with you soon.</p>
    <p style="margin-top:24px;">Regards,<br><strong th:text="${ownerName}">[YOUR_NAME]</strong></p>
</div>
</body>
</html>
